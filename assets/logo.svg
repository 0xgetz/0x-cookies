<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34e5b0"/>
      <stop offset="1" stop-color="#1fbf97"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#6b5ce7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b642"/>
      <stop offset="1" stop-color="#e39a1e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#34e5b0" stroke-opacity="0.18" stroke-width="2"/>

  <!-- hex ring -->
  <g transform="translate(256 262)" filter="url(#glow)">
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="none" stroke="url(#violet)" stroke-width="9" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- cookie -->
  <g transform="translate(256 262)">
    <circle r="92" fill="url(#amber)"/>
    <circle r="92" fill="none" stroke="#0b0f14" stroke-opacity="0.25" stroke-width="4"/>
    <!-- chips -->
    <circle cx="-30" cy="-34" r="15" fill="#3a2410"/>
    <circle cx="30" cy="-24" r="11" fill="#3a2410"/>
    <circle cx="-40" cy="26" r="12" fill="#3a2410"/>
    <circle cx="20" cy="40" r="14" fill="#3a2410"/>
    <circle cx="46" cy="12" r="9" fill="#3a2410"/>
    <circle cx="-8" cy="6" r="8" fill="#3a2410"/>
    <!-- mint cursor bracket -->
    <path d="M-52 -70 L-52 -88 L-34 -88" fill="none" stroke="url(#mint)" stroke-width="9" stroke-linecap="round"/>
    <path d="M52 -70 L52 -88 L34 -88" fill="none" stroke="url(#mint)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-52 70 L-52 88 L-34 88" fill="none" stroke="url(#mint)" stroke-width="9" stroke-linecap="round"/>
    <path d="M52 70 L52 88 L34 88" fill="none" stroke="url(#mint)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <text x="256" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="70" fill="url(#mint)" filter="url(#glow)">0x</text>
</svg>
